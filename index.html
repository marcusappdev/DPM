<style>
/* DPM Hub only - shared look is in shared/dpm.css */
.logo .chip img{height:34px}
.signin .crest{width:170px;height:auto;display:block;margin:0 auto 10px}
.logo small{display:block;font-weight:400;font-size:11px;color:#c9d1db;letter-spacing:.2px}
header .rolesel{background:#1d3550;color:#fff;border:1px solid rgba(255,255,255,.3);border-radius:6px;padding:4px 6px;font-size:12px}
.sec{background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--sc,var(--accent));border-radius:var(--r);padding:14px 16px;margin-bottom:16px;box-shadow:var(--shadow)}
.sec > h3{margin:0 0 12px;font-size:13px;text-transform:uppercase;letter-spacing:.4px;color:var(--sc,var(--accent))}
.sec.s-ctl{--sc:#1d4e89}.sec.s-sum{--sc:#0f8a80}.sec.s-lines{--sc:#7c3aed}.sec.s-docs{--sc:#b45309}.sec.s-chk{--sc:#b91c1c}.sec.s-hist{--sc:#64748b}
@media (prefers-color-scheme:dark){.sec.s-ctl{--sc:#6f9bf5}.sec.s-sum{--sc:#3cc2b6}.sec.s-lines{--sc:#a98bf5}.sec.s-docs{--sc:#eaa24f}.sec.s-chk{--sc:#f87171}.sec.s-hist{--sc:#98a2b0}}
.edhead{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.edhead h2{font-size:20px}
.edhead .sub{color:var(--muted);font-size:13px}
.actions{position:sticky;bottom:0;z-index:5;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 14px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;box-shadow:0 -4px 12px rgba(16,24,40,.08)}
.actions .grow{flex:1}
.lines{min-width:1680px}
.lines th{cursor:default;padding:7px 6px}
.lines td{padding:4px 4px;vertical-align:middle}
.lines tbody tr{cursor:default}
.lines tbody tr:hover{background:transparent}
.lines input,.lines select{width:100%;border:1px solid var(--line);border-radius:6px;padding:5px 6px;background:var(--surface2);font-size:13px;min-width:0}
.lines input[type=checkbox]{width:auto}
.lines input.n{text-align:right;font-variant-numeric:tabular-nums;min-width:62px}
.lines input.n.m{min-width:104px}
.lines tr.bad td:first-child{box-shadow:inset 4px 0 0 var(--crit)}
.lines tr.bad input.e{border-color:var(--crit);background:var(--bad-bg)}
.lines tfoot td{font-weight:650;padding:8px 6px;border-top:2px solid var(--line);font-variant-numeric:tabular-nums;text-align:right}
.lines .rn{color:var(--muted);text-align:center;font-size:12px}
.lines .x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px}
.chk{list-style:none;margin:0;padding:0}
.chk li{display:flex;gap:10px;padding:6px 0;border-bottom:1px solid var(--line);font-size:13px;align-items:baseline}
.chk li:last-child{border:0}
.chk .tag{flex:none;font-size:11px;font-weight:700;border-radius:5px;padding:1px 7px;text-transform:uppercase}
.chk .e .tag{background:var(--bad-bg);color:var(--crit)}
.chk .w .tag{background:var(--warn-bg);color:var(--warn)}
.chk .rule{font-weight:600}
.okline{color:var(--ok);font-weight:600}
.docs td{vertical-align:middle}
.upl{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px}
.upl label.fld{min-width:190px}
.hist li{cursor:default}
.tabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.note{font-size:12px;color:var(--muted)}
.rowsum td{font-weight:650;background:var(--surface2)}
.readonly input,.readonly select,.readonly textarea{pointer-events:none;background:var(--grey-bg)!important}
.kpi.k-b{--kc:#1d4e89}.kpi.k-p{--kc:#b45309}.kpi.k-a{--kc:#15803d}.kpi.k-r{--kc:#b91c1c}.kpi.k-h{--kc:#7c3aed}.kpi.k-g{--kc:#0f8a80}.kpi.k-s{--kc:#c8962e}
.kpi .v.sm{font-size:22px}
/* register: full width, figures on one line */
body.wide main{max-width:none}
table.reg td,table.reg th{white-space:nowrap}
table.reg td.ag{white-space:normal;min-width:190px;max-width:280px}
table.reg td:nth-child(5){white-space:normal;min-width:140px}
table.reg .r{text-align:right}
#printHead{display:none}
@media print{
  @page{size:A4 landscape;margin:10mm}
  header,.banner,.bar,.toast,dialog{display:none!important}
  body,main{background:#fff!important;color:#000!important}
  body.wide main{padding:0;max-width:none}
  #printHead{display:block;margin-bottom:8px}
  #printHead h1{font-size:15pt;margin:0 0 4px}
  #printHead p{font-size:9pt;margin:0 0 2px}
  .tablewrap{box-shadow:none!important;border:0!important;overflow:visible!important}
  table.reg{min-width:0!important;width:100%;font-size:8pt;border-collapse:collapse}
  table.reg th,table.reg td{padding:3px 5px!important;border-bottom:1px solid #ccc;color:#000!important}
  table.reg thead{display:table-header-group}
  table.reg tr{break-inside:avoid}
  table.reg .note{color:#444!important;font-size:7pt}
  table.reg .pill{background:none!important;border:0!important;padding:0!important;color:#000!important;font-weight:400}
  table.reg tr.rowsum td{font-weight:700;border-top:2px solid #000}
}
/* two ways in: manual batch / scanned batch */
header nav .navsep{width:1px;align-self:stretch;background:rgba(255,255,255,.25);margin:6px 6px}
body.scanmode main{max-width:none}
.startscan{max-width:760px;margin:10px auto 30px;padding:26px 30px}
.startscan h2{margin:0 0 8px;font-size:22px}
.drop{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;border:2px dashed var(--accent);border-radius:14px;padding:44px 20px;margin:18px 0;cursor:pointer;background:var(--surface2);text-align:center}
.drop:hover,.drop.over{background:#fff4cc}
@media (prefers-color-scheme:dark){.drop:hover,.drop.over{background:#3d3210}}
.drop .big{font-size:18px;font-weight:700}
.startscan ol.next{margin:6px 0 14px;padding-left:20px;line-height:1.7}
.scantop{margin-bottom:12px}
.strip{display:flex;gap:10px;overflow-x:auto;padding-bottom:6px}
.strip .pg{flex:0 0 158px}
.strip .pg img{height:120px}
.split{display:grid;grid-template-columns:minmax(0,1fr) minmax(360px,44%);gap:16px;align-items:stretch}
.split .left{min-width:0}
.viewpane{position:sticky;top:84px;height:calc(100vh - 100px);display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--shadow)}
.viewpane .vh{display:flex;gap:6px;align-items:center;padding:8px 12px;border-bottom:1px solid var(--line);font-size:13px;flex-wrap:wrap}
.viewpane .vh .grow{flex:1}
.viewpane .vb{flex:1;overflow:auto;background:#525659;display:flex;justify-content:center;align-items:flex-start;padding:12px}
.viewpane img{max-width:100%;background:#fff;box-shadow:0 2px 10px rgba(0,0,0,.45)}
.viewpane.zoom img{max-width:none;width:190%}
@media (max-width:1000px){.split{grid-template-columns:1fr}.viewpane{position:relative;top:0;height:60vh}}
/* the Hub's own message dialog */
.msgdlg{width:min(520px,92vw)}
.msgdlg .msg{white-space:pre-wrap;margin:0 0 10px;line-height:1.5}
.msgdlg .errdetails{white-space:pre-wrap;font-size:12px;background:var(--surface2);border:1px solid var(--line);border-radius:8px;padding:10px;margin:8px 0 0;user-select:all}
.msgdlg details summary{cursor:pointer}
/* scanned batch */
.sec.s-scan{--sc:#0e7490}
@media (prefers-color-scheme:dark){.sec.s-scan{--sc:#38bdf8}}
.scanbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.scanbar label.btn{cursor:pointer}
.pages{display:grid;grid-template-columns:repeat(auto-fill,minmax(176px,1fr));gap:12px}
.pg{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--surface2);display:flex;flex-direction:column;gap:6px}
.pg.on{outline:3px solid var(--accent);outline-offset:1px}
.pg img{width:100%;height:200px;object-fit:contain;background:#fff;border-radius:6px;cursor:zoom-in;border:1px solid var(--line)}
.pg select{font-size:12px;padding:4px;border:1px solid var(--line);border-radius:6px;background:var(--surface);width:100%}
.pg .pgn{display:flex;justify-content:space-between;align-items:center;gap:6px;font-size:12px;font-weight:650}
.btn.sm{padding:4px 10px;font-size:12px}
input.auto,select.auto{background:#fff4cc!important;border-color:#d4a017!important}
@media (prefers-color-scheme:dark){input.auto,select.auto{background:#3d3210!important}}
.readnotes{background:var(--warn-bg);border-radius:8px;padding:8px 14px;margin:0 0 12px;font-size:13px}
.readnotes ul{margin:4px 0 0;padding-left:18px}

<header>
  <div class="logo"><span class="chip"><img src="shared/dpm-crest.png" alt="Papua New Guinea national crest"></span><div>Document Management Hub<small id="orgname"></small></div></div>

<script src="shared/dpm-config.js?v=20261122c"></script>
<script src="shared/dpm-core.js?v=20261122e"></script>
<script>
/* =====================================================================
   DPM Document Management Hub  v1.0
   Registers batches of payroll documents submitted by government agencies:
   Batch Control Form + DPM Validated Summary + one Special Offline Payment
   Form per employee. Checks every entry, rejects the whole batch if any form
   fails, keeps the scans in SharePoint with their details, and shows a dashboard.
   While CLIENT_ID in shared/dpm-config.js is the placeholder, the app runs in
   DEMO mode with made-up data held in the browser only.
   ===================================================================== */
const CONFIG = { ...DPM_TENANT, SCOPES:["Sites.ReadWrite.All","User.Read"],
  LISTS: dpmLists({ agencies:"Agencies", ttypes:"TransactionTypes", paycodes:"PayCodes", doctypes:"DocumentTypes",
    users:"Users", settings:"Settings", numbers:"Numbers", batches:"Batches", lines:"PaymentLines", events:"BatchEvents", docs:"BatchDocuments" }) };
const L = CONFIG.LISTS;
const DEMO = String(CONFIG.CLIENT_ID).startsWith("<<");

const FORM_TYPES = ["New and Amended Employee Information","Employee Salary / Permanent Variation Advice","Employee Salary Allowances / Permanent Variation Advice","Employee Salary Deductions / Permanent Variation Advice","Employee Salary Tax / Permanent Variation Advice","Employee Salary Disbursement / Permanent Variation Advice","Employee Overtime / Shift Temporary Variation Advice","Request for Higher Duties Allowance","Leave Application","Returned from Leave","Offline Payment (Normal Pay)","Offline Payment (Special Pay)","Termination Advice"];
const NATURES = ["Deceased","Resignation","Retirement","Retrenchment","Termination","Dismissal","Contract completion","Not applicable"];
const DOC_TYPES = ["Batch Control Form","DPM Validated Summary","Special Offline Payment Form","Gratuity Calculation","Higher Duties Calculation","Final Entitlements Calculation","Agency Schedule","Other Supporting Document"];
const ROLES = ["Data Entry","Checker","Manager (read only)","Admin"];
const STATUS_PILL = { "Draft":"p-grey", "Submitted for check":"p-info", "Verified":"p-info", "Accepted":"p-ok", "Rejected":"p-crit", "Returned to agency":"p-warn", "Superseded":"p-grey" };
const LINE_PILL = { "Pending":"p-grey", "OK":"p-ok", "Query":"p-warn", "Held - marked paid":"p-warn", "Rejected":"p-crit" };

let S = { settings:{}, settingRows:[], agencies:[], ttypes:[], paycodes:[], doctypes:[], users:[], numbers:[], batches:[], lines:[], events:[], docs:[] };
let me = { name:"", email:"", role:"Manager (read only)", note:"" };
let view = "dash", ed = null, docDrive = null;
const F = { b:{ q:"", status:"", week:"" }, r:{ q:"", agency:"", tt:"", status:"", week:"" }, d:{ week:"", agency:"" }, ref:"agencies" };

/* ---------------- settings, roles ---------------- */
const setting = (k, def = "") => { const v = S.settings[k]; return v == null || v === "" ? def : String(v); };
const canEnter = () => ["Data Entry","Checker","Admin"].includes(me.role);
const canCheck = () => ["Checker","Admin"].includes(me.role);
const isAdmin  = () => me.role === "Admin";
function resolveMe(){
  if (DEMO){ const names = { "Data Entry":"Demo Entry Officer", "Checker":"Demo Checker", "Manager (read only)":"Demo Manager", "Admin":"Demo User" };
    me = { name: names[me.role] || "Demo User", email:"demo@example.com", role: me.role, note:"" }; return; }
  const email = String(account?.username || "").toLowerCase();
  me.name = account?.name || email; me.email = email;
  if (!S.users.length){ me.role = "Admin"; me.note = `No one is in ${L.users} yet, so everyone is treated as Admin. Add people and their Hub Role to the list.`; return; }
  const u = S.users.find(x => String(x.UserEmail || "").toLowerCase() === email && x.UserActive !== "No");
  if (u){ me.role = u.HubRole || "Manager (read only)"; me.name = u.Title || me.name; me.note = ""; }
  else { me.role = "Manager (read only)"; me.note = `You're not in ${L.users}, so the Hub is read-only for you. Ask an Admin to add you.`; }
}

/* ---------------- loading ---------------- */
async function loadAll(){
  if (DEMO){ S = demoData(); return; }
  await getSite();
  const keys = ["settings","agencies","ttypes","paycodes","doctypes","users","numbers","batches","lines","events"];
  const res = await Promise.all(keys.map(k => listItems(L[k]).catch(e => { e.list = L[k]; throw e; })));
  keys.forEach((k, i) => { if (k === "settings") S.settingRows = res[i]; else S[k] = res[i]; });
  S.settings = Object.fromEntries(S.settingRows.map(r => [r.Title, r.SettingValue ?? ""]));
}

/* ---------------- agencies, transaction types ---------------- */
const lines = txt => String(txt || "").split(/\r?\n/).map(s => s.trim()).filter(Boolean);
// "Lands & Physical Planning", "Lands and Physical Planning." and "LANDS AND PHYSICAL PLANNING" all match
const agKey = v => norm(v).replace(/&/g, " and ").replace(/^(the|dept\.?|department) of /, "").replace(/[^a-z0-9]+/g, "");
function matchAgency(name){
  const n = agKey(name); if (!n) return null;
  return S.agencies.find(a => agKey(a.Title) === n || lines(a.Aliases).some(x => agKey(x) === n)) || null;
}
const ttype = t => S.ttypes.find(x => x.Title === t);
function weekEnding(d){
  if (!isRealDate(d)) return "";
  const names = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const startIdx = Math.max(0, names.indexOf(setting("WeekStartsOn", "Monday")));
  const [y,m,dd] = d.split("-").map(Number); const dow = new Date(y, m-1, dd).getDay();
  const back = (dow - startIdx + 7) % 7;
  return addDays(addDays(d, -back), 6);
}

/* =====================================================================
   CHECKS - every rule a batch must pass before it can be accepted.
   One error anywhere = the whole batch is rejected (setting RejectWholeBatch).
   ===================================================================== */
function checkBatch(b, ls, docs){
  const out = [], E = (rule, msg, line) => out.push({ sev:"e", rule, msg, line }), W = (rule, msg, line) => out.push({ sev:"w", rule, msg, line });
  const tol = num(setting("AmountTolerance", "0")) + 0.005, maxTax = num(setting("MaxTaxPct", "40"));
  const req = [["AgencyName","Agency"],["PayNo","Pay No"],["PayDate","Pay Date"],["FormType","Type of Form"],["NumberOfForms","Number of Forms"],
    ["RaisedBy","Batch Raised By"],["RaisedDate","Date Raised"],["ReceivedDate","Date Received"],["TransactionType","Transaction Type"],
    ["SummaryPreparedBy","Summary Prepared By"],["SummaryPreparedDate","Summary Prepared Date"],["SummaryCheckedBy","Summary Checked By"],["SummaryCheckedDate","Summary Checked Date"]];
  const miss = req.filter(([k]) => b[k] === undefined || b[k] === null || String(b[k]).trim() === "").map(([, l]) => l);
  if (miss.length) E("Required fields", `Missing: ${miss.join(", ")}`);
  if (b.AgencyName && !matchAgency(b.AgencyName)) W("Agency not in list", `"${b.AgencyName}" isn't in the Agencies list or its other names - check the spelling or add it`);
  if (b.PayNo && !/^\d{1,2}\/\d{2}$/.test(String(b.PayNo).trim())) E("Pay No format", `Pay No "${b.PayNo}" should look like 23/26`);
  ["PayDate","RaisedDate","ReceivedDate","PADate","SummaryPreparedDate","SummaryCheckedDate","SummaryValidatedDate","SummaryCertifiedDate"].forEach(k => {
    if (b[k] && !isRealDate(b[k])) E("Invalid date", `${k.replace(/([A-Z])/g, " $1").trim()} "${b[k]}" isn't a real date`);
  });
  if (isRealDate(b.RaisedDate) && b.RaisedDate > TODAY) E("Date in the future", `Date Raised ${fmtDate(b.RaisedDate)} is after today`);
  // sign-offs in date order: prepared <= checked <= validated <= certified
  const order = [["Prepared","SummaryPreparedDate"],["Checked","SummaryCheckedDate"],["Validated","SummaryValidatedDate"],["Certified","SummaryCertifiedDate"]].filter(([, k]) => isRealDate(b[k]));
  for (let i = 1; i < order.length; i++) if (b[order[i][1]] < b[order[i-1][1]])
    E("Sign-off dates out of order", `${order[i][0]} ${fmtDate(b[order[i][1]])} is before ${order[i-1][0]} ${fmtDate(b[order[i-1][1]])}`);
  if (!ls.length) E("No payment lines", "Add a line for each employee on the summary");
  // totals written on the summary must equal the lines
  const sum = k => r2(ls.reduce((a, l) => a + num(l[k]), 0));
  [["TotalGross","Gross"],["TotalTax","Tax"],["TotalNet","Net"]].forEach(([k, f]) => {
    if (b[k] !== "" && b[k] != null && Math.abs(num(b[k]) - sum(f)) > tol) E("Totals don't agree", `Summary total ${f.toLowerCase()} ${kina(b[k])} but the lines add up to ${kina(sum(f))}`);
  });
  const pinkReq = setting("RequirePinkFormPerLine", "Yes") === "Yes";
  if (b.NumberOfForms !== "" && b.NumberOfForms != null && pinkReq && num(b.NumberOfForms) !== ls.length)
    E("Number of forms", `Batch Control Form says ${b.NumberOfForms} form(s) but there are ${ls.length} payment line(s)`);
  const tt = ttype(b.TransactionType);
  const seen = {};
  ls.forEach((l, i) => {
    const who = `Line ${i+1}${l.EmployeeName ? " (" + l.EmployeeName + ")" : ""}`;
    const emp = String(l.EmployeeNo || "").trim().toUpperCase();
    if (!emp) E("Employee number", `${who}: employee / file number is missing`, i);
    else if (!/^\d{7}[0-9A-Z]$/.test(emp)) E("Employee number", `${who}: "${emp}" should be 8 characters (e.g. 01539775 or 0136415A) - check for a dropped digit`, i);
    if (!String(l.EmployeeName || "").trim()) E("Employee name", `${who}: name is missing`, i);
    if (!(num(l.Gross) > 0)) E("Amounts", `${who}: gross must be more than zero`, i);
    if (num(l.Gross) > 0 && Math.abs(num(l.Gross) - num(l.Tax) - num(l.Net)) > tol)
      E("Net = gross - tax", `${who}: ${kina(l.Gross)} - ${kina(l.Tax)} = ${kina(num(l.Gross) - num(l.Tax))}, but net is ${kina(l.Net)}`, i);
    const rate = num(l.Gross) > 0 ? num(l.Tax) / num(l.Gross) * 100 : 0;
    if (rate > maxTax + 0.05) E(`Tax over ${maxTax}%`, `${who}: tax is ${rate.toFixed(1)}% of gross`, i);
    if (l.StatedTaxPct !== "" && l.StatedTaxPct != null && num(l.Gross) > 0 && Math.abs(rate - num(l.StatedTaxPct)) > 0.5)
      E("Tax rate differs from remarks", `${who}: remarks say ${l.StatedTaxPct}% but tax is ${rate.toFixed(1)}%`, i);
    const hasPeriod = (l.PeriodFrom && l.PeriodTo) || String(l.PeriodText || "").trim();
    if ((!tt || tt.NeedsPeriod !== "No") && !hasPeriod) E("Payment period", `${who}: payment period is missing`, i);
    if (l.PeriodFrom && !isRealDate(l.PeriodFrom)) E("Invalid date", `${who}: Period From isn't a real date`, i);
    if (l.PeriodTo && !isRealDate(l.PeriodTo)) E("Invalid date", `${who}: Period To isn't a real date`, i);
    if (isRealDate(l.PeriodFrom) && isRealDate(l.PeriodTo) && l.PeriodTo < l.PeriodFrom) E("Payment period", `${who}: period ends before it starts`, i);
    if (String(l.PeriodText || "").trim() && !(l.PeriodFrom && l.PeriodTo)) W("Period dates", `${who}: only the written period is entered - add From / To dates if the form gives them`, i);
    if (tt && tt.NeedsNature === "Yes" && !l.NatureOfClaim) E("Nature of claim", `${who}: nature of claim is needed for ${b.TransactionType}`, i);
    if (pinkReq && l.PinkFormMatched !== "Yes") E("Pink form", `${who}: no matching Special Offline Payment Form ticked`, i);
    if (l.MarkedPaid) E("Marked paid - held", `${who}: a handwritten "Paid" note is on the form - hold and confirm it hasn't been paid already`, i);
    // duplicates inside the batch
    const k = emp + "|" + (l.PayCode || l.PaymentCategory || "");
    if (emp && seen[k] != null) E("Duplicate in batch", `${who}: same employee and pay code as line ${seen[k]+1}`, i); else if (emp) seen[k] = i;
    // duplicates and name mismatches elsewhere in the register
    if (emp){
      const others = S.lines.filter(x => String(x.EmployeeNo || "").toUpperCase() === emp && x.BatchRef !== b.Title);
      const live = others.filter(x => { const ob = S.batches.find(y => y.Title === x.BatchRef); return ob && !["Rejected","Returned to agency","Superseded"].includes(ob.BatchStatus) && ob.Title !== b.ResubmissionOf; });
      const dup = live.find(x => x.TransactionType === b.TransactionType &&
        ((l.PeriodFrom && x.PeriodFrom === l.PeriodFrom && x.PeriodTo === l.PeriodTo) || (!l.PeriodFrom && norm(x.PeriodText) && norm(x.PeriodText) === norm(l.PeriodText))));
      if (dup) E("Possible duplicate payment", `${who}: ${b.TransactionType} for the same period is already in batch ${dup.BatchRef} (${kina(dup.Net)} net)`, i);
      const other = others.find(x => x.EmployeeName && l.EmployeeName && norm(x.EmployeeName) !== norm(l.EmployeeName));
      if (other) W("Name differs", `${who}: employee ${emp} is "${other.EmployeeName}" in batch ${other.BatchRef} - check the number belongs to this person`, i);
    }
  });
  const autoN = (ed && ed.b === b ? ed.auto?.size || 0 : 0) + ls.reduce((a, l) => a + (l._auto?.size || 0), 0);
  if (autoN) W("Read automatically", `${autoN} value(s) were filled from the scan and are highlighted - check each against the page, then edit or leave it`);
  if (docs){
    const has = t => docs.some(d => d.DocumentType === t);
    if (b.Title && !has("Batch Control Form")) W("Documents", "No scan of the Batch Control Form attached yet");
    if (b.Title && !has("DPM Validated Summary")) W("Documents", "No scan of the DPM Validated Summary attached yet");
  }
  return out;
}

/* ---------------- list-view events ---------------- */
function bindView(){
  const m = $("#main");
  m.onclick = e => {
    const t = e.target;
    const kp = t.closest("[data-go]"); if (kp){ const [v, s] = kp.dataset.go.split("|"); if (v === "batches"){ F.b.status = s; F.b.week = F.d.week; } else { F.r.status = s; F.r.week = F.d.week; } go(v); if (location.hash.slice(1) === v) route(); return; }
    const o = t.closest("[data-open]"); if (o) return go("batch/" + encodeURIComponent(o.dataset.open));
    const or = t.closest("[data-openref]"); if (or){ const b = S.batches.find(x => x.Title === or.dataset.openref); if (b) go("batch/" + encodeURIComponent(b.id)); return; }
    const bs = t.closest("[data-bs]"); if (bs){ F.b.status = bs.dataset.bs; render(); return; }
    const rf = t.closest("[data-ref]"); if (rf){ F.ref = rf.dataset.ref; render(); return; }
    const ag = t.closest("[data-ag]"); if (ag && canEnter()){ agencyDialog(S.agencies.find(x => String(x.id) === ag.dataset.ag)); return; }
    const st = t.closest("[data-set]"); if (st && isAdmin()){ settingDialog(st.dataset.set); return; }
    if (t.id === "newB") return go("batch/new");
    if (t.id === "newS") return go("scan/new");
    if (t.id === "newAg") return agencyDialog();
    if (t.id === "rPrint") return printRegister();
    if (t.id === "rCsv") return csv(`${BRAND.SHORT}-register-${TODAY}.csv`, registerRows(), REG_COLS);
  };
  const on = (id, fn) => { const el = $("#" + id); if (el) el.addEventListener(el.type === "search" ? "input" : "change", fn); };
  on("dWeek", e => { F.d.week = e.target.value; render(); });
  on("dAg", e => { F.d.agency = e.target.value; render(); });
  on("bQ", e => { F.b.q = e.target.value; renderKeep("bQ"); });
  on("bWeek", e => { F.b.week = e.target.value; render(); });
  on("rQ", e => { F.r.q = e.target.value; renderKeep("rQ"); });
  on("rAg", e => { F.r.agency = e.target.value; render(); });
  on("rTT", e => { F.r.tt = e.target.value; render(); });
  on("rSt", e => { F.r.status = e.target.value; render(); });
  on("rWk", e => { F.r.week = e.target.value; render(); });
}

function openBatch(id, mode = "manual"){
  if (id === "new"){
    if (!canEnter()){ tell(`Your role (${me.role}) can't enter batches.`); go("batches"); return; }
    ed = { b:{ BatchStatus:"Draft", ReceivedDate:TODAY, FormType:"Offline Payment (Special Pay)", CaptureMethod:"Manual entry" }, lines:[blankLine()], removed:[], docs:[], isNew:true, auto:new Set(), scan:newScan(), mode };
  } else {
    const b = S.batches.find(x => String(x.id) === String(id));
    if (!b){ tell("That batch wasn't found - it may have been removed."); go("batches"); return; }
    ed = { b:{ ...b }, lines: batchLines(b.Title).sort((x, y) => String(x.Title).localeCompare(String(y.Title))).map(l => ({ ...l, MarkedPaid: l.LineStatus === "Held - marked paid" })), removed:[], docs:null, auto:new Set(), scan:newScan(), mode:"manual" };
    if (!ed.lines.length) ed.lines = [blankLine()];
    loadDocs();
  }
  ed.dirty = false; render();
}
const editable = () => ed && canEnter() && ["Draft","Submitted for check"].includes(ed.b.BatchStatus || "Draft");

function field([k, label, type = "text", req, ph]){
  const v = ed.b[k] ?? "", cls = type === "agency" || k === "SummaryRef" || k === "PAOfficer" ? "w2" : "";
  const lab = `<span class="${req ? "req" : ""}">${esc(label)}</span>`;
  let inp;
  if (type === "form") inp = `<select data-f="${k}"><option></option>${FORM_TYPES.map(x => opt(x, v)).join("")}</select>`;
  else if (type === "ttype") inp = `<select data-f="${k}"><option></option>${S.ttypes.filter(t => t.TTActive !== "No" || t.Title === v).map(t => opt(t.Title, v)).join("")}</select>`;
  else if (type === "yesno") inp = `<select data-f="${k}"><option></option>${opt("Yes", v)}${opt("No", v)}</select>`;
  else if (type === "agency") inp = `<input data-f="${k}" list="dlAg" value="${esc(v)}" placeholder="Type to search agencies">`;
  else if (type === "region") inp = `<input data-f="${k}" list="dlRegions" value="${esc(v)}">`;
  else if (type === "date") inp = `<input type="date" data-f="${k}" value="${esc(v)}">`;
  else if (type === "number" || type === "money") inp = `<input type="number" ${type === "money" ? 'step="0.01"' : 'step="1" min="0"'} data-f="${k}" value="${esc(v)}">`;
  else inp = `<input data-f="${k}" value="${esc(v)}" ${ph ? `placeholder="${esc(ph)}"` : ""}>`;
  if (ed.auto?.has(k)) inp = inp.replace(/^<(input|select)/, `<$1 class="auto" title="Filled by Read automatically - check it against the scan"`);
  return `<label class="fld ${cls}">${lab}${inp}</label>`;

    <td style="text-align:center"><input type="checkbox" data-l="${i}" data-k="PinkFormMatched" ${l.PinkFormMatched === "Yes" ? "checked" : ""} title="Matching Special Offline Payment Form is in the batch"></td>

function bindScanStart(){

// Migrated batches: the old register has no Batch Control Form or summary, so the entry checks don't apply.
// Show what the migration flagged on each line instead.
function migratedFlagsHtml(){
  const flagged = ed.lines.map((l, i) => ({ l, i })).filter(x => String(x.l.ValidationFlags || "").trim());
  return `<h3>Flags from the migration</h3>${flagged.length ? `<p><b>${flagged.length} line(s) marked Query</b> - check them against the paper documents.</p><ul class="chk">${flagged.map(({ l, i }) => lines(l.ValidationFlags).map(f => `<li class="e"><span class="tag">Query</span><span><span class="rule">Line ${i+1}${l.EmployeeName ? " (" + esc(l.EmployeeName) + ")" : ""}</span> - ${esc(f)}</span></li>`).join("")).join("")}</ul>` : `<p class="okline">✓ Nothing flagged on these lines.</p>`}`;
}
function checksHtml(checks){
  const e = checks.filter(c => c.sev === "e"), w = checks.filter(c => c.sev === "w");
  const li = c => `<li class="${c.sev}"><span class="tag">${c.sev === "e" ? "Error" : "Check"}</span><span><span class="rule">${esc(c.rule)}</span> - ${esc(c.msg)}</span></li>`;
  return `<h3>Checks</h3>${e.length ? `<p><b>${e.length} error(s)</b> - ${setting("RejectWholeBatch", "Yes") === "Yes" ? "the whole batch must be rejected unless these are corrected from the documents" : "these must be fixed"}.</p>` : `<p class="okline">✓ No errors - the batch passes every check.</p>`}
    <ul class="chk">${e.map(li).join("")}${w.map(li).join("")}</ul>`;
}
function actionNote(nErr, own){
  const s = ed.b.BatchStatus || "Draft";
  if (!canEnter()) return "Read only for your role.";
  if (s === "Draft") return nErr ? "Save as draft while you enter. It can be submitted once it has no errors, or a Checker can reject it." : "Ready to submit for checking.";
  if (s === "Submitted for check") return canCheck() ? (own ? "You entered this batch - another Checker must accept it." : nErr ? "Errors found - reject the batch and return it to the agency." : "All checks pass - accept or reject.") : "Waiting for a Checker.";
  if (s === "Superseded") return "Superseded - a repeated copy kept for the record; not counted in totals or duplicate checks.";
  if (s === "Accepted") return isMigrated(ed.b) ? "Imported from the old register - counted in the totals; read only." : `Accepted by ${ed.b.AcceptedBy || ""} on ${fmtDate(ed.b.AcceptedDate)} - locked.`;
  return "Rejected - return it to the agency; a corrected batch is entered as a resubmission.";
}
function actionButtons(nErr, own){
  const s = ed.b.BatchStatus || "Draft", out = [];
  if (editable()){ out.push(`<button class="btn" id="aSave">Save draft</button>`); if (s === "Draft") out.push(`<button class="btn primary" id="aSubmit" ${nErr ? "disabled title='Fix the errors first, or ask a Checker to reject it'" : ""}>Submit for check</button>`); }
  if (canCheck() && ["Draft","Submitted for check"].includes(s) && ed.b.Title) out.push(`<button class="btn danger" id="aReject">Reject batch…</button>`);

/* ---------------- numbering ---------------- */
async function nextRef(){
  const fmt = setting("BatchFormat", "B-{yyyy}-{n:4}");
  const key = fmt.replace(/\{yyyy\}/g, YEAR).replace(/\{n(:\d+)?\}/g, "").replace(/[-_ ]+$/, "") || "B";
  let row = S.numbers.find(n => n.Title === key);
  let n = num(row?.LastNumber);
  // never reuse a number already on a batch (e.g. counter reset)
  const used = S.batches.map(b => { const m = String(b.Title || "").startsWith(key) ? /(\d+)\D*$/.exec(b.Title) : null; return m ? +m[1] : 0; });
  n = Math.max(n, ...used, 0) + 1;
  if (!DEMO){ if (row) await saveListItem(L.numbers, row.id, { LastNumber:n }); else { row = await saveListItem(L.numbers, null, { Title:key, LastNumber:n }); S.numbers.push(row); } }
  if (row) row.LastNumber = n; else S.numbers.push({ id:"n" + Date.now(), Title:key, LastNumber:n });
  return fmt.replace(/\{yyyy\}/g, YEAR).replace(/\{n(?::(\d+))?\}/g, (_, w) => pad(n, +w || 1));
}
async function logEvent(ref, type, details = ""){
  const ev = { Title:ref, EventType:type, EventBy:me.name, EventOn:`${TODAY} ${hhmm(new Date())}`, Details:details };
  try { const saved = DEMO ? { id:"e" + Date.now() + Math.random(), ...ev } : await saveListItem(L.events, null, ev); S.events.push({ ...ev, ...saved }); }
  catch(e){ showError("Saved, but the history entry wasn't written", e, "The batch itself was saved. Only its history line is missing."); }
}

const B_FIELDS = ["AgencyName","BatchNumber","PayNo","PayDate","FormType","NumberOfForms","FirstAdviceNo","LastAdviceNo","RaisedBy","RaisedByPhone","RaisedDate","PAOfficer","PADate","PAStamped",

let saving = false;
async function saveBatch(newStatus, opts = {}){
  if (saving) return; saving = true;
  const btns = $$(".actions button"); btns.forEach(x => x.disabled = true);
  try {
    const b = ed.b, wasNew = !b.id, prev = b.BatchStatus || "Draft";
    const a = matchAgency(b.AgencyName); if (a) b.AgencyName = a.Title;
    if (!String(b.AgencyName || "").trim()) throw new Error("enter the agency first");
    // drop completely empty lines
    ed.lines = ed.lines.filter(l => L_FIELDS.some(k => l[k] !== "" && l[k] != null && !(k === "PinkFormMatched" && l[k] === "No")) || l.MarkedPaid || l.id);
    if (!b.Title) b.Title = await nextRef();
    if (wasNew){ b.EnteredBy = me.name; b.EnteredDate = TODAY; }
    if (newStatus) b.BatchStatus = newStatus; else b.BatchStatus = prev;
    const checks = checkBatch(b, ed.lines, ed.docs), errs = checks.filter(c => c.sev === "e");
    if (newStatus === "Submitted for check" && errs.length) throw new Error("fix the errors first");
    if (newStatus === "Accepted" && errs.length) throw new Error("every check must pass before accepting");
    const lineErr = i => errs.filter(c => c.line === i).map(c => c.rule);
    const st = b.BatchStatus;
    const fields = { Title:b.Title, ...clean(b, B_FIELDS), LineCount: ed.lines.length, WeekEnding: weekEnding(b.ReceivedDate) };
    const saved = DEMO ? { id: b.id || "b" + Date.now() } : await saveListItem(L.batches, b.id, fields);
    b.id = b.id || saved.id; Object.assign(b, fields);
    const bi = S.batches.findIndex(x => String(x.id) === String(b.id)); if (bi >= 0) S.batches[bi] = { ...b }; else S.batches.push({ ...b });
    // lines
    for (let i = 0; i < ed.lines.length; i++){
      const l = ed.lines[i], le = lineErr(i);
      const status = st === "Rejected" || st === "Returned to agency" ? "Rejected" : l.MarkedPaid ? "Held - marked paid" : st === "Accepted" ? "OK" : le.length ? "Query" : "Pending";
      const lf = { Title:`${b.Title}-${pad(i+1, 2)}`, BatchRef:b.Title, AgencyName:b.AgencyName, TransactionType:b.TransactionType, PayNo:b.PayNo, WeekEnding:fields.WeekEnding,
        ...clean(l, L_FIELDS), TaxRatePct: num(l.Gross) > 0 ? r2(num(l.Tax) / num(l.Gross) * 100) : null, LineStatus:status, ValidationFlags: errs.filter(c => c.line === i).map(c => c.msg).join("\n") };
      const r = DEMO ? { id: l.id || "l" + Date.now() + i } : await saveListItem(L.lines, l.id, lf);
      l.id = l.id || r.id; Object.assign(l, lf);
      const li = S.lines.findIndex(x => String(x.id) === String(l.id)); const copy = { ...l }; delete copy.MarkedPaid; delete copy._autoNet; delete copy._auto;
      if (li >= 0) S.lines[li] = copy; else S.lines.push(copy);
    }
    for (const g of ed.removed){ if (!DEMO) await deleteListItem(L.lines, g.id); S.lines = S.lines.filter(x => String(x.id) !== String(g.id)); }
    ed.removed = [];
    // audit trail
    if (wasNew) await logEvent(b.Title, b.ResubmissionOf ? "Resubmitted" : "Created", b.ResubmissionOf ? `Resubmission of ${b.ResubmissionOf}` : `${ed.lines.length} line(s), ${kina(sumOf(ed.lines, "Gross"))} gross`);
    if (opts.event) await logEvent(b.Title, opts.event, opts.details || "");
    else if (newStatus && newStatus !== prev) await logEvent(b.Title, newStatus, newStatus === "Submitted for check" ? `${ed.lines.length} line(s), ${kina(sumOf(ed.lines, "Net"))} net, no errors` : "");
    else if (!wasNew && prev !== "Draft") await logEvent(b.Title, "Edited", `${errs.length} error(s) after the change`);
    ed.dirty = false; ed.isNew = false;
    toast(newStatus ? `${b.Title}: ${b.BatchStatus}` : `${b.Title} saved`);
    if (location.hash !== "#batch/" + encodeURIComponent(b.id)) history.replaceState(null, "", "#batch/" + encodeURIComponent(b.id));
    if (wasNew) loadDocs(); else render();
  } catch(e){
    showError("The batch wasn't saved", e, isForbidden(e) ? "You don't have permission to save in SharePoint - ask the site owner to add you to the DPM Officers group." : "Nothing was lost - your entries are still on the screen. Fix the problem and press Save again.");
    $$(".actions button").forEach(x => x.disabled = false);
  } finally { saving = false; }
}

/* =====================================================================
   SCANNED BATCH - load the scan, view pages beside the form, Read
   automatically (Claude on Amazon Bedrock, Australia), file the pages as
   separate documents. A web page can't drive a scanner: the scanner's own
   software (or the Windows Scan app) saves the batch as a PDF or images.
   ===================================================================== */
const READ_TYPES = ["Auto-detect", ...DOC_TYPES];
const newScan = () => ({ pages:[], notes:[], keep:true, view:null, zoom:false, busy:false });
const readOn = () => setting("ReadAutomatically", "Off") !== "Off" && /^https:\/\//.test(setting("AwsApiUrl"));
let pdfjsLib = null;
async function loadPdfJs(){
  if (!pdfjsLib){
    pdfjsLib = await import("https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.min.mjs");
    pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdn.jsdelivr.net/npm/pdfjs-dist@4.10.38/build/pdf.worker.min.mjs";
  }
  return pdfjsLib;
}
const loadScript = src => new Promise((ok, no) => { const s = document.createElement("script"); s.src = src; s.onload = ok; s.onerror = () => no(new Error("couldn't load " + src)); document.head.appendChild(s); });
async function loadPdfLib(){ if (!window.PDFLib) await loadScript("https://cdn.jsdelivr.net/npm/pdf-lib@1.17.1/dist/pdf-lib.min.js"); return window.PDFLib; }

// Each page -> a JPEG about 1800 px on its long side (sharp enough for handwriting) + a thumbnail
function pageImages(c){
  const t = document.createElement("canvas"), s = 220 / Math.max(c.width, c.height);
  t.width = Math.round(c.width * s); t.height = Math.round(c.height * s); t.getContext("2d").drawImage(c, 0, 0, t.width, t.height);
  return { jpg: c.toDataURL("image/jpeg", 0.85), thumb: t.toDataURL("image/jpeg", 0.75), w:c.width, h:c.height };
}
function whiteCanvas(w, h){ const c = document.createElement("canvas"); c.width = Math.round(w); c.height = Math.round(h); const x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, c.width, c.height); return c; }
async function pagesFromFiles(files, onProgress){
  const out = [];
  for (const f of files){
    if (/pdf$/i.test(f.type) || /\.pdf$/i.test(f.name)){
      const lib = await loadPdfJs(), bytes = new Uint8Array(await f.arrayBuffer());
      const doc = await lib.getDocument({ data: bytes.slice() }).promise;
      for (let p = 1; p <= doc.numPages; p++){
        const page = await doc.getPage(p), v1 = page.getViewport({ scale:1 });
        const vp = page.getViewport({ scale: Math.min(3, 1800 / Math.max(v1.width, v1.height)) });
        const c = whiteCanvas(vp.width, vp.height);
        await page.render({ canvasContext:c.getContext("2d"), viewport:vp }).promise;
        out.push({ file:f, bytes, srcPage:p - 1, isPdf:true, ...pageImages(c) });
        onProgress?.(out.length);
      }
    } else if (/^image\//.test(f.type)){
      const url = URL.createObjectURL(f);
      const img = await new Promise((ok, no) => { const i = new Image(); i.onload = () => ok(i); i.onerror = () => no(new Error(`${f.name} isn't an image the browser can open (HEIC photos: save as JPEG first)`)); i.src = url; });
      const s = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
      const c = whiteCanvas(img.naturalWidth * s, img.naturalHeight * s); c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      out.push({ file:f, isPdf:false, ...pageImages(c) });
      onProgress?.(out.length);
    } else throw new Error(`${f.name}: only PDF or image files`);
  }
  return out.map(p => ({ ...p, type:"Auto-detect", emp:"", status:"", note:"", rot:0 }));
}

/* ---------------- what to read: one schema for every document type ---------------- */
const sS = d => ({ type:["string","null"], ...(d ? { description:d } : {}) }), sN = d => ({ type:["number","null"], ...(d ? { description:d } : {}) }), sB = d => ({ type:["boolean","null"], ...(d ? { description:d } : {}) });
const obj = props => ({ type:"object", properties:props });
function readSchema(){
  return { type:"object", required:["documentType"], properties:{
    documentType:{ type:"string", enum:DOC_TYPES, description:"Which kind of document this page is" },
    batchControl: obj({ department:sS(), payNo:sS("e.g. 23/26"), payDate:sS(), formTypeTicked:{ type:["string","null"], enum:[...FORM_TYPES, null] }, numberOfForms:sN(), batchNumber:sS(),
      firstAdviceNo:sS(), lastAdviceNo:sS(), raisedBy:sS(), telephone:sS(), dateRaised:sS(), publicAccountsOfficer:sS(), publicAccountsDate:sS(), publicAccountsStamp:sB("true if the Public Accounts stamp is on the page") }),
    summary: obj({ agency:sS(), transactionType:sS("e.g. Gratuity, Final Entitlement, Higher Duties Allowance, Outstanding Salary"), dpmRegionOrBranch:sS(), summaryRef:sS("e.g. Costing for batch #003"),
      preparedBy:sS(), preparedDate:sS(), checkedBy:sS(), checkedDate:sS(), validatedBy:sS(), validatedDate:sS(), certifiedBy:sS(), certifiedDate:sS(),
      totalGross:sN(), totalTax:sN(), totalNet:sN(), agencyClaimedGross:sN("only when the page ALSO shows the agency's own claimed total, separate from the DPM validated figures"),
      lines:{ type:"array", items: obj({ employeeNo:sS(), employeeName:sS(), natureOfClaim:sS("e.g. Deceased, Resignation"), paymentCategory:sS("e.g. MILOL, MILOL + MILOF"),
        periodFrom:sS(), periodTo:sS(), periodAsWritten:sS(), fortnights:sN(), gross:sN(), tax:sN(), net:sN(), taxRateStatedPct:sN("tax % written in the remarks, e.g. Marginal Tax @ 40% -> 40"),
        remarks:sS(), markedPaid:sB("true if 'Paid' has been handwritten or ticked against this employee") }) } }),
    paymentForm: obj({ employeeNo:sS("Employee Selection #: written ONE character per box, normally 8 boxes - read each box separately, left to right, and keep leading zeros"),
      employeeNumberBoxes:{ type:["array","null"], items:{ type:"string" }, description:"the Employee Selection # box by box, one character per item, exactly as written" },
      employeeName:sS("Surname & Other Name, letter by letter as written"), department:sS(), reason:sS(), periodEndDate:sS("from the Period End Date boxes (day, month, year)"),
      payLines:{ type:"array", items: obj({ date:sS(), payCode:sS("e.g. AGR35, AGR40, TAX - compare with the known pay codes"), units:sN(), rate:sN("the Rate column, read on its own"), amount:sN("the Amount column, read on its own - do not copy it from Rate") }) },
      preparedBy:sS(), preparedDate:sS(), checkedBy:sS(), checkedDate:sS(), markedPaid:sB("true if 'Paid' is handwritten on the form") }),
    calculation: obj({ employeeNo:sS(), employeeName:sS(), totalGross:sN(), tax:sN(), net:sN(), periodAsWritten:sS() }),
    unclear:{ type:"array", items:{ type:"string" }, description:"fields that were blank, crossed out or hard to read" }

}
function readInstructions(pg){
  const extra = S.doctypes.filter(d => String(d.ReadInstructions || "").trim()).map(d => `${d.Title}: ${d.ReadInstructions}`).join("\n");
  return `${pg.type === "Auto-detect" ? "First decide which kind of document this page is." : `This page is a ${pg.type}.`}
Fill ONLY the section for that kind of document and leave the other sections out:
- Batch Control Form (cover sheet listing the type of form ticked, pay no, number of forms) -> batchControl
- DPM Validated Summary (summary / costing table of one or more employees with gross, tax, net) -> summary, one entry in "lines" per employee row
- Special Offline Payment Form (pink form for ONE employee, with pay code lines) -> paymentForm
- Gratuity, Higher Duties or Final Entitlements calculation sheet -> calculation (the employee's final totals)
- Agency Schedule or anything else -> only documentType
If a summary page shows both an agency claim table and a DPM validated table, use the DPM validated figures for the lines and put the agency's claimed total gross in agencyClaimedGross.
Reading handwriting carefully:
- Boxed numbers (Employee Selection #, dates, pay run) are written one character per box. Read every box on its own, left to right. Employee numbers are normally 8 characters, the last one sometimes a letter; never drop or merge a box.
- Each digit of an amount matters. On the pink form the Rate and the Amount columns usually repeat the same figure - read each column separately; if they disagree, report both as read and name the line in "unclear".
- Pay codes the Hub knows: ${S.paycodes.map(p => p.Title).join(", ")}. A handwritten code is almost always one of these (e.g. 3 and 2 look alike in AGR35).
- Dates on these forms are written day / month / year (PNG). Return them as YYYY-MM-DD, with the month in the middle.
- Copy names letter by letter as written; don't correct spelling.
- "unclear" is only for something WRITTEN that is hard to read. Don't list boxes that are simply blank.
Agencies the Hub knows: ${S.agencies.map(a => a.Title).join("; ")}.
${extra}`.trim();
}
async function callReader(pg){
  const tok = DEMO ? "demo" : await idToken();
  const r = await fetch(setting("AwsApiUrl"), { method:"POST", headers:{ Authorization:"Bearer " + tok, "Content-Type":"application/json" },
    body: JSON.stringify({ image: pg.jpg.split(",")[1], format:"jpeg", schema: readSchema(), instructions: readInstructions(pg) }) });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(r.status === 401 ? "the reading service didn't accept your sign-in" : r.status === 429 ? "too many pages at once - wait a moment" : j.error || j.message || `reading service error ${r.status}`);
  return j.fields || {};
}

/* ---------------- apply what was read to the batch ---------------- */
const FIELD_LABEL = k => (CTL.concat(SUM).find(x => x[0] === k) || [k, k])[1];
const empKey = v => String(v ?? "").toUpperCase().replace(/\s+/g, "");
function toDate(v, notes, what){
  if (v == null || v === "") return null;
  let s = String(v).trim(), m;
  if ((m = /^(\d{1,2})[./-](\d{1,2})[./-](\d{2,4})$/.exec(s))) s = `${m[3].length === 2 ? "20" + m[3] : m[3]}-${pad(m[2])}-${pad(m[1])}`;
  if (isRealDate(s)) return s;
  if ((m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s)) && isRealDate(`${m[1]}-${m[3]}-${m[2]}`)){
    notes.push(`${what}: read as "${v}" - taken as ${fmtDate(`${m[1]}-${m[3]}-${m[2]}`)} (day and month swapped); check it`);
    return `${m[1]}-${m[3]}-${m[2]}`;
  }
  notes.push(`${what}: "${v}" isn't a real date - enter it by hand`); return null;
}
const same = (a, b) => norm(a).replace(/[^a-z0-9]/g, "") === norm(b).replace(/[^a-z0-9]/g, "");
function matchTType(v){ const n = norm(v); if (!n) return null; const t = S.ttypes.find(x => norm(x.Title) === n || lines(x.Aliases).some(a => norm(a) === n) || n.includes(norm(x.Title))); return t ? t.Title : null; }
function applyRead(pg, f){
  const notes = [], P = `Page ${pg.n}`;
  if (DOC_TYPES.includes(f.documentType)) pg.type = f.documentType;
  const setB = (k, v) => {
    if (v == null || v === "") return;
    const cur = ed.b[k];
    if (cur == null || String(cur).trim() === ""){ ed.b[k] = v; ed.auto.add(k); }
    else if (same(cur, v)) return;
    else if (!(typeof v === "number" && Math.abs(num(cur) - v) < 0.005)) notes.push(`${P}: ${FIELD_LABEL(k)} on the page is "${v}", the form has "${cur}" - kept the form's value`);
  };
  const setAgency = v => { if (!v) return; const a = matchAgency(v); setB("AgencyName", a ? a.Title : String(v).trim()); if (!a) notes.push(`${P}: agency "${v}" isn't in the Agencies list`); };
  const lineFor = (emp, name) => {
    const k = empKey(emp);
    let l = k && ed.lines.find(x => empKey(x.EmployeeNo) === k);
    if (!l && name) l = ed.lines.find(x => norm(x.EmployeeName) && norm(x.EmployeeName) === norm(name));
    if (!l){ l = ed.lines.find(x => !x.EmployeeNo && !x.EmployeeName && !x.Gross); if (!l){ l = blankLine(); ed.lines.push(l); } }
    l._auto ||= new Set(); return l;
  };
  const setL = (l, k, v) => {
    if (v == null || v === "") return;
    if (l[k] == null || String(l[k]).trim() === "" || (k === "PinkFormMatched" && l[k] === "No")){ l[k] = v; l._auto.add(k); }
    else if (norm(l[k]) !== norm(v) && !(typeof v === "number" && Math.abs(num(l[k]) - v) < 0.005)) notes.push(`${P}: ${l.EmployeeName || l.EmployeeNo} - ${k} on the page is ${typeof v === "number" ? kina(v) : `"${v}"`}, the line has ${typeof v === "number" ? kina(l[k]) : `"${l[k]}"`}`);
  };
  const bc = f.batchControl, su = f.summary, pf = f.paymentForm, ca = f.calculation;
  if (bc && pg.type === "Batch Control Form"){
    setAgency(bc.department); setB("PayNo", bc.payNo); setB("PayDate", toDate(bc.payDate, notes, `${P} pay date`));
    if (bc.formTypeTicked) setB("FormType", bc.formTypeTicked); if (bc.numberOfForms != null) setB("NumberOfForms", bc.numberOfForms);
    setB("BatchNumber", bc.batchNumber); setB("FirstAdviceNo", bc.firstAdviceNo); setB("LastAdviceNo", bc.lastAdviceNo); setB("RaisedBy", bc.raisedBy);
    setB("RaisedByPhone", bc.telephone); setB("RaisedDate", toDate(bc.dateRaised, notes, `${P} date raised`)); setB("PAOfficer", bc.publicAccountsOfficer);
    setB("PADate", toDate(bc.publicAccountsDate, notes, `${P} public accounts date`)); if (bc.publicAccountsStamp != null) setB("PAStamped", bc.publicAccountsStamp ? "Yes" : "No");
  }
  if (su && pg.type === "DPM Validated Summary"){
    setAgency(su.agency);
    if (su.transactionType){ const t = matchTType(su.transactionType); if (t) setB("TransactionType", t); else notes.push(`${P}: transaction type "${su.transactionType}" isn't in the list - choose it by hand`); }
    setB("DPMRegion", su.dpmRegionOrBranch); setB("SummaryRef", su.summaryRef);
    [["SummaryPreparedBy", su.preparedBy], ["SummaryCheckedBy", su.checkedBy], ["SummaryValidatedBy", su.validatedBy], ["SummaryCertifiedBy", su.certifiedBy]].forEach(([k, v]) => setB(k, v));
    [["SummaryPreparedDate", su.preparedDate, "prepared date"], ["SummaryCheckedDate", su.checkedDate, "checked date"], ["SummaryValidatedDate", su.validatedDate, "validated date"], ["SummaryCertifiedDate", su.certifiedDate, "certified date"]].forEach(([k, v, w]) => setB(k, toDate(v, notes, `${P} ${w}`)));
    ["TotalGross","TotalTax","TotalNet","AgencyClaimedGross"].forEach((k, i) => { const v = [su.totalGross, su.totalTax, su.totalNet, su.agencyClaimedGross][i]; if (v != null) setB(k, v); });
    (su.lines || []).forEach(x => {
      if (!x.employeeNo && !x.employeeName) return;
      const l = lineFor(x.employeeNo, x.employeeName);
      setL(l, "EmployeeNo", x.employeeNo ? empKey(x.employeeNo) : null); setL(l, "EmployeeName", x.employeeName);
      if (x.natureOfClaim){ const nat = NATURES.find(n => norm(x.natureOfClaim).startsWith(norm(n))); setL(l, "NatureOfClaim", nat || null); }
      setL(l, "PaymentCategory", x.paymentCategory); setL(l, "PeriodFrom", toDate(x.periodFrom, notes, `${P} ${x.employeeName || ""} period from`)); setL(l, "PeriodTo", toDate(x.periodTo, notes, `${P} ${x.employeeName || ""} period to`));
      setL(l, "PeriodText", x.periodAsWritten); setL(l, "Fortnights", x.fortnights); setL(l, "Gross", x.gross); setL(l, "Tax", x.tax); setL(l, "Net", x.net);
      setL(l, "StatedTaxPct", x.taxRateStatedPct); setL(l, "Remarks", x.remarks);
      if (x.markedPaid){ l.MarkedPaid = true; l._auto.add("MarkedPaid"); notes.push(`${P}: "Paid" is marked against ${x.employeeName || x.employeeNo} - line held`); }
    });
  }
  if (pf && pg.type === "Special Offline Payment Form"){
    // The box-by-box reading is the more careful one; use it when it gives a full number
    const boxes = (pf.employeeNumberBoxes || []).map(x => String(x ?? "").trim()).filter(Boolean).join("");
    let empNo = pf.employeeNo ? empKey(pf.employeeNo) : "";
    if (boxes && empKey(boxes) !== empNo){
      if (boxes.length === 8 || !empNo){ if (empNo) notes.push(`${P}: employee number read as ${empNo} and box by box as ${empKey(boxes)} - used ${empKey(boxes)}; check it`); empNo = empKey(boxes); }
      else notes.push(`${P}: employee number read as ${empNo}, box by box as ${empKey(boxes)} - check it`);
    }
    const l = lineFor(empNo, pf.employeeName);
    setL(l, "EmployeeNo", empNo || null); setL(l, "EmployeeName", pf.employeeName);
    const pl = (pf.payLines || []).filter(x => x.amount != null);
    // The pink form writes each figure twice (Rate and Amount): if they disagree, a digit was misread
    let consistent = true;
    pl.forEach(x => {
      if (x.rate != null && x.amount != null){
        const expect = r2(num(x.rate) * (x.units == null ? 1 : num(x.units)));
        if (Math.abs(expect - num(x.amount)) > 0.01){ consistent = false; notes.push(`${P}: ${x.payCode || "pay line"} - Rate × Units is ${kina(expect)} but Amount was read as ${kina(x.amount)}. Check the figure on the form.`); }
      }
      const known = S.paycodes.map(p => p.Title.toUpperCase()), code = String(x.payCode || "").toUpperCase().replace(/\s+/g, "");
      if (code && known.length && !known.includes(code)) notes.push(`${P}: pay code "${x.payCode}" isn't one the Hub knows (${known.join(", ")}) - check it`);
    });
    const gross = r2(pl.filter(x => !/^tax$/i.test(String(x.payCode || "").trim())).reduce((a, x) => a + num(x.amount), 0));
    const tax = r2(pl.filter(x => /^tax$/i.test(String(x.payCode || "").trim())).reduce((a, x) => a + num(x.amount), 0));
    const code = (pl.find(x => !/^tax$/i.test(String(x.payCode || "").trim())) || {}).payCode;
    const tol = num(setting("AmountTolerance", "0")) + 0.005;
    if (String(l.Gross ?? "") === "" && gross > 0){ setL(l, "Gross", gross); setL(l, "Tax", tax); setL(l, "Net", r2(gross - tax)); if (consistent) setL(l, "PinkFormMatched", "Yes"); }
    else if (gross > 0){
      if (Math.abs(num(l.Gross) - gross) <= tol && Math.abs(num(l.Tax) - tax) <= tol){ if (consistent) setL(l, "PinkFormMatched", "Yes"); }
      else notes.push(`${P}: pink form for ${pf.employeeName || pf.employeeNo} shows gross ${kina(gross)}, tax ${kina(tax)} - the summary line has ${kina(l.Gross)}, ${kina(l.Tax)}. Not matched.`);
    }
    setL(l, "PayCode", code); setL(l, "Reason", pf.reason); setL(l, "PeriodEndDate", toDate(pf.periodEndDate, notes, `${P} period end date`));
    if (pf.markedPaid){ l.MarkedPaid = true; l._auto.add("MarkedPaid"); notes.push(`${P}: "Paid" is written on ${pf.employeeName || pf.employeeNo}'s pink form - line held`); }
    pg.emp = l.EmployeeNo || pg.emp;
  }
  if (ca && /Calculation$/.test(pg.type)){
    const k = empKey(ca.employeeNo), l = ed.lines.find(x => (k && empKey(x.EmployeeNo) === k) || (ca.employeeName && norm(x.EmployeeName) === norm(ca.employeeName)));
    if (!l) notes.push(`${P}: calculation for ${ca.employeeName || ca.employeeNo || "an employee"} doesn't match any line`);
    else {
      pg.emp = l.EmployeeNo || pg.emp;
      [["gross", ca.totalGross, "Gross"], ["tax", ca.tax, "Tax"], ["net", ca.net, "Net"]].forEach(([w, v, key]) => {
        if (v != null && String(l[key] ?? "") !== "" && Math.abs(num(l[key]) - v) > 0.01) notes.push(`${P}: calculation sheet for ${l.EmployeeName || l.EmployeeNo} gives ${w} ${kina(v)}, the line has ${kina(l[key])}`);
      });
    }
  }
  (f.unclear || []).forEach(u => notes.push(`${P}: unclear - ${u}`));
  return notes;
}

function keepScroll(fn){ const y = scrollY; fn(); scrollTo(0, y); }
async function loadScanFiles(files){
  const sc = ed.scan; if (!files.length || sc.busy) return;
  sc.busy = true; sc.busyText = "Opening the scan…"; keepScroll(render);
  try {
    const pages = await pagesFromFiles(files, n => { sc.busyText = `Opening the scan… ${n} page(s)`; const b = $("#scanSec .note b"); if (b) b.textContent = sc.busyText; });
    pages.forEach(p => { p.n = sc.pages.length + 1; sc.pages.push(p); });
    if (sc.view == null) sc.view = 0;
    toast(`${pages.length} page(s) loaded`);
  } catch(err){ showError("Couldn't open the scan", err, "Use a PDF or JPEG/PNG images. Photos from an iPhone may need saving as JPEG first."); }
  sc.busy = false; sc.busyText = ""; keepScroll(render);
}
function bindScan(){
  const sec = $("#scanSec"), sc = ed.scan;
  $(".viewpane")?.addEventListener("click", e => {
    const t = e.target.closest("button"); if (!t) return;
    if (t.dataset.vp) sc.view = Math.max(0, Math.min(sc.pages.length - 1, sc.view + +t.dataset.vp));
    if (t.dataset.vrot) sc.pages[sc.view].rot = (sc.pages[sc.view].rot + 90) % 360;
    if (t.dataset.vzoom) sc.zoom = !sc.zoom;
    keepScroll(render);
  });
  const dz = $("#dropZone");
  if (dz){
    ["dragenter","dragover"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.add("over"); }));
    ["dragleave","drop"].forEach(ev => dz.addEventListener(ev, e => { e.preventDefault(); dz.classList.remove("over"); }));
    dz.addEventListener("drop", e => loadScanFiles([...(e.dataTransfer?.files || [])]));
  }
  if (!sec) return;
  sec.addEventListener("click", async e => {
    const v = e.target.closest("[data-view]"); if (v){ sc.view = +v.dataset.view; keepScroll(render); return; }
    const r = e.target.closest("[data-read]"); if (r){ await readPages([+r.dataset.read]); return; }
    if (e.target.id === "scAll") await readPages(sc.pages.map((p, i) => p.status === "read" ? -1 : i).filter(i => i >= 0));
    if (e.target.id === "scFile") await fileScan();
    if (e.target.id === "scClear" && await ask("Remove the loaded pages from this screen?\nDocuments already filed stay in SharePoint.", { title:"Clear the scan", ok:"Remove pages", danger:true })){ ed.scan = newScan(); keepScroll(render); }
  });
  sec.addEventListener("change", async e => {

    if (t.dataset.pgt) sc.pages[+t.dataset.pgt].type = t.value;
    if (t.dataset.pge) sc.pages[+t.dataset.pge].emp = t.value;

  });
}
async function readPages(idx){
  const sc = ed.scan; if (!idx.length) return;
  if (!readOn()) return tell("Read automatically is off. An Admin sets AwsApiUrl and ReadAutomatically in Settings.", { title:"Read automatically" });
  sc.busy = true; let ok = 0, bad = 0; const failed = [];
  for (const i of idx){
    const p = sc.pages[i]; p.status = "reading"; sc.busyText = `Reading page ${p.n} (${ok + bad + 1} of ${idx.length})…`; keepScroll(render);
    try { const f = await callReader(p); sc.notes.push(...applyRead(p, f)); p.status = "read"; p.note = ""; ok++; ed.dirty = true; }
    catch(e){ p.status = "error"; p.note = e.message; bad++; failed.push(`Page ${p.n}: ${e.message}`); }
  }
  sc.busy = false; sc.busyText = "";
  if (ok && ed.b.Title) logEvent(ed.b.Title, "Read automatically", `${ok} page(s) read${bad ? `, ${bad} failed` : ""}`);
  keepScroll(render);
  if (bad) showError(`${bad} page(s) couldn't be read`, { message: failed.join("\n") }, ok ? `${ok} page(s) were read - check their highlighted values. Press Read automatically on the others to try again.` : "Press Read automatically on a page to try again.");
  else toast(`${ok} page(s) read - check the highlighted values`);
}
// Split the scan into documents: each run of pages with the same type and employee becomes one PDF
async function fileScan(){
  const sc = ed.scan, b = ed.b;
  if (!b.Title || ed.dirty) return tell("Save the batch first (Save draft). Documents are filed under its Batch Ref.", { title:"File documents" });
  const groups = [];
  sc.pages.forEach(p => {
    const type = p.type === "Auto-detect" ? "Other Supporting Document" : p.type, last = groups[groups.length - 1];
    if (last && last.type === type && last.emp === p.emp) last.pages.push(p); else groups.push({ type, emp:p.emp, pages:[p] });
  });
  if (!(await ask(`File ${groups.length} document(s) from ${sc.pages.length} page(s) into\n${L.docs}/${safeName(b.AgencyName)}/${b.Title}?${sc.keep ? "\n\nThe complete scan is kept as well." : ""}`, { title:"File documents", ok:"File documents" }))) return;
  sc.busy = true; let done = 0;
  try {
    const PL = await loadPdfLib();
    if (!DEMO && !docDrive) docDrive = await libraryDrive(L.docs);
    if (!DEMO && !docDrive) throw new Error(`the ${L.docs} library isn't set up yet`);
    const srcDocs = new Map();
    const folder = `${safeName(b.AgencyName)}/${b.Title}`;
    const put = async (name, blob, meta) => {
      if (DEMO) S.docs.push({ id:"doc" + Date.now() + Math.random(), FileLeafRef:name, url:URL.createObjectURL(blob), ...meta });
      else { const item = await uploadToDrive(docDrive, folder, name, blob); await tagDriveItem(docDrive, item.id, meta); }
    };
    for (const g of groups){
      sc.busyText = `Filing document ${done + 1} of ${groups.length}…`; keepScroll(render);
      const out = await PL.PDFDocument.create();
      for (const p of g.pages){
        let page;
        if (p.isPdf){
          if (!srcDocs.has(p.bytes)) srcDocs.set(p.bytes, await PL.PDFDocument.load(p.bytes, { ignoreEncryption:true }));
          [page] = await out.copyPages(srcDocs.get(p.bytes), [p.srcPage]); out.addPage(page);
        } else {
          const img = await out.embedJpg(Uint8Array.from(atob(p.jpg.split(",")[1]), c => c.charCodeAt(0)));
          page = out.addPage([p.w * 0.75, p.h * 0.75]); page.drawImage(img, { x:0, y:0, width:p.w * 0.75, height:p.h * 0.75 });
        }
        if (p.rot) page.setRotation(PL.degrees(((page.getRotation().angle || 0) + p.rot) % 360));
      }
      const blob = new Blob([await out.save()], { type:"application/pdf" });
      const ln = ed.lines.find(l => l.EmployeeNo && l.EmployeeNo === g.emp);
      const pr = g.pages.length > 1 ? `p${g.pages[0].n}-${g.pages[g.pages.length - 1].n}` : `p${g.pages[0].n}`;
      const name = `${b.Title} ${g.type}${g.emp ? " " + g.emp : ""} ${pr}.pdf`.replace(/\s+/g, " ");
      await put(name, blob, { BatchRef:b.Title, AgencyName:b.AgencyName, DocumentType:g.type, EmployeeNo:g.emp || "", EmployeeName:ln?.EmployeeName || "",
        PayNo:b.PayNo || "", PayDate:b.PayDate || "", TransactionType:b.TransactionType || "", PageCount:g.pages.length, DocAmount: ln ? num(ln.Gross) : null,
        DocStatus:"Received", ReadMethod: g.pages.some(p => p.status === "read") ? "Scanned - read automatically" : "Manual entry" });
      done++;
    }
    if (sc.keep){
      for (const f of [...new Set(sc.pages.map(p => p.file))]){
        sc.busyText = "Keeping the complete scan…"; keepScroll(render);
        await put(`${b.Title} Complete scan - ${safeName(f.name)}`, f, { BatchRef:b.Title, AgencyName:b.AgencyName, DocumentType:"Other Supporting Document", PayNo:b.PayNo || "", PayDate:b.PayDate || "",
          TransactionType:b.TransactionType || "", DocStatus:"Received", ReadMethod:"Manual entry", DocNotes:"Complete scan of the batch as received" });
      }
    }
    await logEvent(b.Title, "Document added", `${done} document(s) filed from ${sc.pages.length} scanned page(s)${sc.keep ? ", plus the complete scan" : ""}`);
    toast(`${done} document(s) filed`);
    ed.scan = newScan(); ed.mode = "manual";
  } catch(e){ showError(done ? `${done} document(s) filed, then it stopped` : "The documents weren't filed", e, "The loaded pages are still here - press File documents again to retry."); }
  sc.busy = false; sc.busyText = "";
  loadDocs();
}
